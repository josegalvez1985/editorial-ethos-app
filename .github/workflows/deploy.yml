name: Desplegar a GitHub Pages

# EL DOMINIO PROPIO ESTÁ PRENDIDO: el sitio se sirve en https://www.ethospy.online/
# y el github.io responde un 301 hacia él. Lo decide `CUSTOM_DOMAIN`, más abajo.
#
# HUBO UN PERÍODO CON EL DOMINIO APAGADO y este comentario decía que seguía así.
# Vale la pena dejar anotado por qué se apagó, porque el problema puede volver:
# el DNS de Hostinger no apuntaba a GitHub y quedó un redirect hacia el github.io
# que chocaba con el 301 que Pages manda hacia el dominio — los dos se apuntaban
# entre sí y no respondía NINGUNA de las dos URLs.
#
# Si vuelve a pasar, apagarlo es poner `CUSTOM_DOMAIN: ""` Y borrar `public/CNAME`
# (el workflow falla si uno dice una cosa y el otro la contraria). Para prenderlo
# de nuevo hay que arreglar PRIMERO el DNS: ver DESPLIEGUE.md → "Volver a prender
# el dominio propio". No alcanza con editar este archivo.
#
# La URL del backend está PUESTA EN ESTE ARCHIVO, no en repository variables,
# para que el repo se despliegue solo: si dependiera de configuración invisible
# en Settings, un clon nuevo compilaría un sitio roto sin avisar. No es secreta
# —termina a la vista en el JS del sitio.

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Lo que necesita actions/deploy-pages para publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cancelar a mitad de
# camino puede dejar el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Declarado UNA sola vez para todo el job: lo usan el paso que calcula la base
    # y el que prepara la salida. Estaba repetido en los dos, y cambiar el dominio
    # obligaba a acordarse de editar los dos lugares.
    #
    # El valor está acá y no en una repository variable a propósito: el repo se
    # despliega solo, sin depender de configuración invisible en Settings que un
    # clon nuevo no tendría. Para cambiar de dominio se edita esta línea; para
    # apagarlo y volver al github.io, se deja en "".
    env:
      # Con dominio: el sitio se sirve en él, cuelga de la RAÍZ (base "/") y el
      # artefacto lleva el CNAME que se lo declara a Pages. Vacío ("") vuelve al
      # github.io, donde el sitio cuelga de /<repo>/ y no va ningún CNAME.
      #
      # Este valor NO alcanza por sí solo: tiene que coincidir con `public/CNAME`
      # (el workflow falla si no) y el DNS del dominio tiene que apuntar a GitHub.
      # Prenderlo con el DNS todavía en el registrador es lo que armó el bucle de
      # redirecciones que dejó el sitio caído. Ver DESPLIEGUE.md.
      #
      # ESTÁ PRENDIDO, y `public/CNAME` dice lo mismo que esta línea.
      CUSTOM_DOMAIN: "www.ethospy.online"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 trae npm 10, pero el package-lock.json lo escribe npm 11 en la
      # máquina de desarrollo. Las dos versiones arman el árbol distinto y npm 10
      # rechazaba el lock con "Missing: lru-cache@11.5.2 from lock file".
      # Fijar la versión hace que el CI use el mismo npm que generó el lock.
      - name: Fijar npm 11 (la versión que escribe el lock)
        run: npm i -g npm@11

      - run: npm ci

      # Dónde cuelga el sitio. Sin dominio propio Pages publica en
      # https://<usuario>.github.io/<repo>/, así que TODO (chunks, css, íconos,
      # rutas del router) tiene que colgar de /<repo>/ o se pide a la raíz del
      # dominio y devuelve 404. Con dominio propio el sitio está en la raíz.
      # Lo decide `CUSTOM_DOMAIN`, en el `env` del job: ver DESPLIEGUE.md.
      # `CUSTOM_DOMAIN` viene del `env` del job. Se usa como variable de shell y
      # NO interpolada en el script: un ${{ }} dentro de `run` se pega como texto
      # ANTES de que bash lea la línea, así que el valor podría cerrar la comilla
      # y ejecutar lo que quiera.
      - name: Calcular la base y el origen del sitio
        id: base
        run: |
          # `site` es el ORIGEN (esquema + host, sin barra final). Va aparte de la
          # base porque las meta tags de Open Graph necesitan URLs absolutas: una
          # ruta como /logo.png no le sirve a WhatsApp ni a Facebook, que leen el
          # HTML sin una página desde la cual resolverla. Ver src/lib/asset.ts.
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "site=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
            # El host de Pages es siempre en minúsculas, el nombre de usuario no
            # necesariamente.
            echo "site=https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build estático
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          # Origen absoluto para el og:image de la vista previa al compartir.
          VITE_SITE_URL: ${{ steps.base.outputs.site }}
          # Apaga nitro y prende el modo SPA, que deja el shell estático que Pages
          # sirve como archivo. Ver vite.config.ts.
          STATIC_BUILD: "1"
          # Sin servidor Node no corre el proxy src/routes/api/ords.$.ts, así que
          # el navegador le pega directo a ORDS. Requiere el CORS abierto que ya
          # tiene el backend.
          #
          # No es un secreto: termina embebida en el JS público, así que ocultarla
          # en Settings no protegería nada. Si el backend se muda, se edita acá.
          VITE_API_URL: "https://oracleapex.com/ords/fundcarac/ethos/"
        run: npm run build

      - name: Preparar la salida para Pages
        run: |
          # Sin el shell no hay sitio: mejor cortar acá con un mensaje que
          # dejar que `cp` falle con un "No such file" sin contexto.
          if [ ! -f dist/client/_shell.html ]; then
            echo "ERROR: no se generó dist/client/_shell.html. ¿Se apagó el modo SPA?" >&2
            exit 1
          fi
          # El prerender del modo SPA deja el shell como _shell.html; Pages sirve
          # index.html en la raíz.
          cp dist/client/_shell.html dist/client/index.html
          # Pages devuelve 404.html en cualquier ruta que no exista como archivo.
          # Siendo el mismo shell, el router resuelve /evaluaciones, /account, etc.
          # del lado del cliente en vez de mostrar el 404 de GitHub.
          cp dist/client/index.html dist/client/404.html
          # Sin esto Jekyll ignora todo lo que empieza con "_" y se come el shell.
          touch dist/client/.nojekyll

          # El CNAME es lo que decide QUÉ URL sirve el sitio: con él, Pages sirve
          # en el dominio y manda un 301 desde el github.io hacia allá. Sin él,
          # el github.io sirve el sitio directo.
          #
          # HOY EL DOMINIO ESTÁ APAGADO, así que el archivo NO debe existir. Se
          # borra por las dudas: un CNAME que se cuele en el artefacto le
          # reactiva el dominio propio a Pages y vuelve el bucle de redirecciones.
          # `rm -f` no falla si no está, que es el caso normal.
          if [ -z "$CUSTOM_DOMAIN" ]; then
            rm -f dist/client/CNAME
          fi

          # Las dos comprobaciones son la misma idea en los dos sentidos: que el
          # artefacto coincida con lo que dice CUSTOM_DOMAIN. Sin esto el build
          # sale verde igual y el error recién se ve en el navegador.
          if [ -z "$CUSTOM_DOMAIN" ] && [ -f dist/client/CNAME ]; then
            echo "ERROR: sobra dist/client/CNAME con el dominio apagado." >&2
            exit 1
          fi
          if [ -n "$CUSTOM_DOMAIN" ] && [ ! -f dist/client/CNAME ]; then
            echo "ERROR: falta dist/client/CNAME. ¿Se borró public/CNAME?" >&2
            exit 1
          fi
          ls -la dist/client

      # Acá se generaba el bundle OTA (`ota/updates.json` + `ota/bundle-<sha>.zip`)
      # que descargaban los APK instalados.
      #
      # Se quitó el 05/08/2026 junto con el plugin de Capgo: el APK ya no
      # empaqueta la web ni descarga bundles. Su WebView apunta directo a este
      # mismo sitio con `server.url` (ver capacitor.config.ts), así que lo que
      # publica este workflow ES lo que ven los teléfonos, sin paso intermedio.
      #
      # Los `ota/*` que quedaron publicados de deploys anteriores se van solos:
      # cada deploy reemplaza el sitio entero por el artefacto nuevo.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
