name: Desplegar a GitHub Pages

# El sitio se publica en https://www.ethospy.online (ver public/CNAME).
# Detalle de por qué el build es estático y qué implica: DESPLIEGUE.md

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Lo que necesita actions/deploy-pages para publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cancelar a mitad de
# camino puede dejar el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 trae npm 10, pero el package-lock.json lo escribe npm 11 en la
      # máquina de desarrollo. Las dos versiones arman el árbol distinto y npm 10
      # rechazaba el lock con "Missing: lru-cache@11.5.2 from lock file".
      # Fijar la versión hace que el CI use el mismo npm que generó el lock.
      - name: Fijar npm 11 (la versión que escribe el lock)
        run: npm i -g npm@11

      - run: npm ci

      # Dónde cuelga el sitio. Sin dominio propio Pages publica en
      # https://<usuario>.github.io/<repo>/, así que TODO (chunks, css, íconos,
      # rutas del router) tiene que colgar de /<repo>/ o se pide a la raíz del
      # dominio y devuelve 404. Con dominio propio el sitio está en la raíz.
      # El interruptor es la repository variable CUSTOM_DOMAIN: ver DESPLIEGUE.md.
      - name: Calcular la base del sitio
        id: base
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build estático
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          # Sin servidor Node no corre el proxy src/routes/api/ords.$.ts, así que
          # el navegador le pega directo a ORDS. Requiere el CORS abierto que ya
          # tiene el backend. Se puede pisar con una repository variable.
          STATIC_BUILD: "1"
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://oracleapex.com/ords/fundcarac/ethos/' }}
        run: npm run build

      - name: Preparar la salida para Pages
        run: |
          # El prerender del modo SPA deja el shell como _shell.html; Pages sirve
          # index.html en la raíz.
          cp dist/client/_shell.html dist/client/index.html
          # Pages devuelve 404.html en cualquier ruta que no exista como archivo.
          # Siendo el mismo shell, el router resuelve /evaluaciones, /account, etc.
          # del lado del cliente en vez de mostrar el 404 de GitHub.
          cp dist/client/index.html dist/client/404.html
          # Sin esto Jekyll ignora todo lo que empieza con "_" y se come el shell.
          touch dist/client/.nojekyll
          # El CNAME se escribe SOLO si hay dominio propio configurado. Si el
          # archivo viaja igual en el artefacto, Pages activa ese dominio y
          # redirige todo hacia él; con el DNS apuntando a otro lado (Hostinger
          # devolvía un 301 de vuelta al github.io) queda un bucle de
          # redirecciones y no responde ninguna URL del sitio.
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/client/CNAME
          fi
          ls -la dist/client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
