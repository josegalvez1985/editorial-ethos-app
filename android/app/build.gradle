apply plugin: 'com.android.application'

// Credenciales de firma del release. El archivo NO se commitea (ver .gitignore);
// si falta, el release sale sin firmar y hay que firmarlo a mano con apksigner.
// Ver APK.md -> "Firmar el APK release".
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.editorialethos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.editorialethos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Subir en CADA versión que se reparta: Android se niega a instalar
        // encima un versionCode menor o igual al ya instalado.
        //
        // 2.0: EL APK PASA A SER UNA CÁSCARA. Ya no empaqueta la web: su WebView
        // apunta a https://www.ethospy.online/ con `server.url`, así que carga el
        // sitio publicado en cada arranque.
        //
        // ESTE APK HAY QUE REPARTIRLO SÍ O SÍ. Es el que engancha el teléfono al
        // mecanismo nuevo; de ahí en adelante un `git push` alcanza y no hace
        // falta repartir nunca más por un cambio de web.
        //
        // Reemplaza al OTA de Capgo (1.9-1.9.2), que publicaba el bundle bien
        // pero no lo aplicaba en el teléfono. Se fueron el plugin, ota.ts,
        // build-ota.mjs, el paso del workflow y OTA.md. Ver el README.
        //
        // OJO: sube el MAYOR (1.x -> 2.0) a propósito. No es un cambio de
        // contenido sino del mecanismo de actualización, y quien quede en 1.x no
        // recibe nada más — conviene que el número lo grite.
        //
        // 1.9.2: el filtro de mes de los gráficos del inicio. El backend dejaba
        // de filtrar en silencio porque la vista devuelve el nombre del mes en
        // el idioma de la sesión —'August   ' desde ORDS, 'Agosto' desde SQL
        // Workshop— y el paquete comparaba contra texto. Ahora sale de
        // EXTRACT(MONTH FROM fecha_hora). Ver backend/intervenciones.sql.
        //
        // 1.9.1: mismo contenido nativo que la 1.9. Sube solo el versionCode
        // porque el 12 ya se usó en un APK que llegó a compilarse con el modo
        // offline (revertido en a5ce4f3: envenenaba la caché y dejaba el combo
        // de facilitadores en blanco). Android rechaza instalar encima un
        // versionCode igual, así que reusarlo dejaría trabado a quien tenga ese
        // APK puesto.
        //
        // 1.9: actualización OTA. A partir de acá, un cambio de la WEB ya no pide
        // un APK nuevo: viaja solo (ver OTA.md). Los cambios NATIVOS —plugins,
        // ícono, splash, permisos, este mismo archivo— siguen necesitándolo.
        //
        // ESTE APK HAY QUE REPARTIRLO SÍ O SÍ: trae el plugin nativo que hace
        // posible el OTA. Los teléfonos con la 1.8 no se actualizan solos hasta
        // tenerlo instalado — es el último reparto manual obligatorio.
        //
        // 1.8: cambio de marca a "Juventud con Valores" — logo, íconos, splash,
        // paleta nueva con 11 temas de color, y evaluaciones que se pueden
        // guardar sin áreas.
        versionCode 15
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                // storeFile es relativo a android/, que es el rootProject de Gradle.
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']

                // Los cuatro esquemas, no solo el v2 que AGP firma por defecto.
                // v1 (JAR): lo exigen los Android viejos, anteriores a 7.0.
                // v3: es el que le permite a Android verificar la IDENTIDAD de la
                //     clave y su cadena de rotación. Sin v3, un APK de fuera de
                //     Play queda como firma no verificable y es una de las señales
                //     que llevan a Play Protect a bloquear la instalación.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sin keystore.properties el release sale SIN FIRMAR (comportamiento
            // de antes) en vez de romper el build con un error críptico.
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
